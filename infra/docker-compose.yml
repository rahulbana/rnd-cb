# Phase 1 local stack: api, worker, Postgres, Redis, Chroma.
# `docker compose -f infra/docker-compose.yml up` boots a fully wired, empty app.
name: rag-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Published on 5433 to avoid clashing with a local Postgres on 5432.
      # Containers still reach it internally at postgres:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.5
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      STORAGE_PROVIDER: local_disk
      LOCAL_STORAGE_DIR: /data/objects
    ports:
      - "8080:8080"
    volumes:
      # Shared with the worker so it can read files the API stored.
      - objectdata:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      STORAGE_PROVIDER: local_disk
      LOCAL_STORAGE_DIR: /data/objects
    volumes:
      - objectdata:/data/objects
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Empty -> the SPA calls /api/v1 relative; nginx proxies it to `api`,
        # so the browser and API share an origin (no CORS needed).
        VITE_API_URL: ""
    ports:
      # App on http://localhost:3000 (nginx listens on 8080 in the container;
      # the API already uses host 8080).
      - "3000:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  chromadata:
  objectdata:
