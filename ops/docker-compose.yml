# Local observability stack: Prometheus + Grafana, pre-wired to scrape the
# Deep Search Agent backend (running on the host at :8000) and auto-load the
# dashboard.
#
#   cd ops && docker compose up -d
#   Grafana:    http://localhost:3000  (admin / admin)
#   Prometheus: http://localhost:9090
#
# Start the backend separately:  uvicorn app.main:app --port 8000
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ds-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Lets the container reach the backend on the host (needed on Linux).
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: ds-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/deep-search-dashboard.json:/var/lib/grafana/dashboards/deep-search-dashboard.json:ro
    depends_on:
      - prometheus
