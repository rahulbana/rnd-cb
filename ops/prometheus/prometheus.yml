global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: deep-search-agent
    metrics_path: /metrics
    static_configs:
      # host.docker.internal works on Docker Desktop (macOS/Windows). On Linux,
      # either run with --add-host=host.docker.internal:host-gateway (set in the
      # compose file) or replace this with your backend host:port.
      - targets: ["host.docker.internal:8000"]
        labels:
          service: deep-search-agent
