[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cribasagent"
version = "0.1.0"
description = "Daily UPSC current-affairs agent: Indian English press to exam-ready Markdown."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "feedparser>=6.0.11",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cribasagent = "cribasagent.cli:main"

[tool.setuptools]
packages = ["cribasagent"]
