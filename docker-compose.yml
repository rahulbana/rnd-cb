# ------------------------------------------------------------------------------
# Diet Planner — local/prod-like deployment with Docker Compose.
#
#   docker compose up --build
#
# Frontend (nginx) is exposed on http://localhost:8080 and proxies /api to the
# backend service over the internal network. SQLite data persists in a named
# volume so plans survive container restarts.
# ------------------------------------------------------------------------------

services:
  backend:
    build:
      context: ./backend
    image: diet-planner-backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite:////data/diet_planner.db
      # Provide a real key to enable the LLM meal planner (falls back otherwise).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # nginx (the browser-facing origin) proxies same-origin, so CORS is not
      # strictly needed, but keep it permissive for direct API access in dev.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - backend_data:/data
    expose:
      - "8000"
    # Uncomment to hit the API directly from the host for debugging:
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: ./frontend
    image: diet-planner-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  backend_data:
