services:
  mcp_server:
    build: ./mcp_server
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8100
      MCP_TMDB_READ_ACCESS_TOKEN: ${MCP_TMDB_READ_ACCESS_TOKEN:-}
      MCP_TMDB_API_KEY: ${MCP_TMDB_API_KEY:-}
    ports:
      - "8100:8100"

  backend:
    build: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your .env}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MCP_SERVER_URL: http://mcp_server:8100/mcp
      MCP_TRANSPORT: streamable_http
      CORS_ALLOW_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    depends_on:
      - mcp_server
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
