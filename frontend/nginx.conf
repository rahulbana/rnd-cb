# nginx config for the production frontend image.
# Serves the built SPA and reverse-proxies /api to the backend API service.
# Listens on 8080 to match Cloud Run's default container port.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container liveness probe target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Reverse-proxy API calls to the backend. API_UPSTREAM is templated by the
    # container entrypoint in compose (defaults to the api service); on Cloud
    # Run the frontend is built with an absolute VITE_API_URL instead.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming (chat + job progress): disable buffering, long timeouts.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
    }

    # SPA fallback: every unknown route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
