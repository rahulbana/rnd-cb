appId: com.rndcb.agent
productName: RND CB Agent
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  # Ship the FastAPI backend alongside the app. A Python runtime with the
  # backend's requirements installed must be available on the target machine.
  - from: ../backend
    to: backend
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!.env'
      - '!.venv/**'
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Development
