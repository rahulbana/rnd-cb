[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-dataset-agent"
version = "1.0.0"
description = "Agentic AI platform that turns natural language into ML-ready datasets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rnd-cb" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "scikit-learn>=1.3",
    "faker>=20.0",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
llm = ["openai>=1.30", "anthropic>=0.30", "litellm>=1.30"]
synthetic = ["sdv>=1.9", "imbalanced-learn>=0.12"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
dataset-agent = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
