[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-editor"
version = "1.0.0"
description = "A full-featured, browser-based Markdown editor with a Python backend"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rnd-cb" }]
keywords = ["markdown", "editor", "flask", "preview", "web"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
]
dependencies = [
    "Flask>=3.0",
    "Markdown>=3.5",
    "Pygments>=2.17",
    "pymdown-extensions>=10.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=7.0", "pywebview>=5.0"]

[project.scripts]
markdown-editor = "markdown_editor.__main__:main"
markdown-editor-desktop = "markdown_editor.desktop:main"

[project.urls]
Homepage = "https://github.com/rahulbana/rnd-cb"

[tool.setuptools.packages.find]
include = ["markdown_editor*"]

[tool.setuptools.package-data]
markdown_editor = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
