[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "m3u8-downloader"
version = "0.1.0"
description = "Download HLS (.m3u8) videos from a URL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only needed for AES-128 encrypted streams.
crypto = ["cryptography>=3.4"]

[project.scripts]
m3u8-dl = "m3u8_downloader.cli:main"

[tool.setuptools]
packages = ["m3u8_downloader"]
