[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factcheck-agent"
version = "0.1.0"
description = "CLI agent that fact-checks a statement strictly against live web sources (OpenAI + Tavily)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40.0",
    "tavily-python>=0.5.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
factcheck = "factcheck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["factcheck*"]
