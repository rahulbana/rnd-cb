[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Multi-step web research agent with a plan→search→read→reflect→synthesize loop, checkpointing, and analyst-grade report generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Deep Research Agent" }]

dependencies = [
    # Agent framework
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    # API + streaming
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    # Config + validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Persistence
    "psycopg[binary,pool]>=3.2.0",
    # Observability
    "langfuse>=2.50.0",
    # Search backends (optional SDKs; HTTP fallbacks exist for most)
    "tavily-python>=0.5.0",
    "exa-py>=1.0.0",
    "arxiv>=2.1.0",
    # Export
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
research = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines are fine here; UP042: `str, Enum` is a deliberate, portable
# idiom that pydantic/FastAPI serialize cleanly.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
