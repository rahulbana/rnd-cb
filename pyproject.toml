[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyplayer"
version = "1.0.0"
description = "A VLC-powered desktop media player with playlist and YouTube support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5",
    "python-vlc>=3.0.18",
    "yt-dlp>=2024.1.0",
]

[project.scripts]
pyplayer = "video_player.app:main"

[tool.setuptools]
packages = ["video_player"]
