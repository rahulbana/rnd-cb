[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datagen"
version = "0.1.0"
description = "Configurable synthetic data generation agent for ML and text projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
parquet = ["pyarrow>=12.0"]
dev = ["pytest>=7.0"]

[project.scripts]
datagen = "datagen.cli:main"

[tool.setuptools]
packages = ["datagen"]
