[project]
name = "travelplanner-backend"
version = "1.0.0"
description = "AI-powered multi-agent travel planner backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
