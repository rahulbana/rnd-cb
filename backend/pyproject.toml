[project]
name = "rag-platform-backend"
version = "0.1.0"
description = "Multi-Document Enterprise RAG Platform -- backend (ports & adapters core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    # Phase 2 -- lightweight, fully-local parsers (default fallback chain)
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    # Phase 5 -- lexical (BM25) sparse retrieval for hybrid search
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Heavy, layout-aware / ML parsers. Installed in the container; optional in dev.
parsers-heavy = [
    "docling>=2.0",
    "unstructured>=0.15",
]
# Phase 3 -- default local embedder + vector stores (installed in the image).
ml = [
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "pgvector>=0.3",
]
# OpenAI embedder / LLM adapters (opt-in).
openai = [
    "openai>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 90
target-version = "py312"
src = ["."]
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["app"]
exclude = ["app/db/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
